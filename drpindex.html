<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Routine Planner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
    }

    .container {
      margin-top: 50px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-group input[type="time"],
    .input-group input[type="text"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      flex: 1;
    }

    .input-group button {
      padding: 8px 14px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      background: #ecf0f1;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    li span {
      flex: 1;
    }

    li button {
      background: #e74c3c;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🗓️ Daily Routine Planner</h1>
    <div class="input-group">
      <input type="time" id="task-time" />
      <input type="text" id="task-desc" placeholder="Enter your task..." />
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="task-list"></ul>
  </div>

  <script>
    function addTask() {
      const time = document.getElementById("task-time").value;
      const desc = document.getElementById("task-desc").value;

      if (!time || !desc) {
        alert("Please enter both time and task.");
        return;
      }

      const list = document.getElementById("task-list");

      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = `${time} - ${desc}`;

      const btn = document.createElement("button");
      btn.textContent = "Delete";
      btn.onclick = () => list.removeChild(li);

      li.appendChild(span);
      li.appendChild(btn);
      list.appendChild(li);

      // Clear input fields
      document.getElementById("task-time").value = "";
      document.getElementById("task-desc").value = "";
    }
    <h2>Daily Routine Planner - Updated</h2>
  </script>
</body>
</html>
